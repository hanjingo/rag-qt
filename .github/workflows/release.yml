name: Release Pipeline

on:
  # 通过上游联动：当 CI 管道执行成功后，自动被触发调用
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
  # 手动调试触发兼容
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PROJECT_NAME: rag-qt

jobs:
  # ================================ Create Release ================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # 【已修复】更换为通过上游事件类型判断。只要上游是正常 push 触发（无论是 tag 还是 branch），且 CI 成功了就放行
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Extract version information
      id: version
      run: |
        # 【已修复】优化优先级：手动输入优先 -> 联动分支名优先 -> 上游触发点 Tag 提取优先 -> Git 兜底
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [[ -n "${{ github.event.workflow_run.head_branch }}" && "${{ github.event.workflow_run.head_branch }}" != "null" ]]; then
          VERSION="${{ github.event.workflow_run.head_branch }}"
        else
          # 如果是 tag 触发导致 head_branch 为空，直接解析最新的本地 tag 关联
          VERSION=$(git tag --points-at ${{ github.event.workflow_run.head_sha }} | head -n 1)
          if [[ -z "$VERSION" ]]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")
          fi
        fi
        
        # 移除可能残留的 refs/tags/ 前缀以防路径长短不一导致拼接崩溃
        VERSION=${VERSION##*/}
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Using version: $VERSION"

    # ================================ 拉取 CI 二进制资产并进行独立打包 ================================
    - name: Download Linux Executable
      uses: actions/download-artifact@v4
      with:
        name: binary-linux
        path: dist/binaries/linux
        run-id: ${{ github.event.workflow_run.id }}

    - name: Download macOS Executable
      uses: actions/download-artifact@v4
      with:
        name: binary-macos
        path: dist/binaries/macos
        run-id: ${{ github.event.workflow_run.id }}

    - name: Download Windows Executable
      uses: actions/download-artifact@v4
      with:
        name: binary-windows
        path: dist/binaries/windows
        run-id: ${{ github.event.workflow_run.id }}

    - name: Compress Platform Independent Packages
      run: |
        VERSION="${{ env.VERSION }}"
        mkdir -p dist/packages
        
        # 1. 打包 Linux 独立运行程序 (.tar.gz)
        cd dist/binaries/linux && tar -czf ../../packages/${{ env.PROJECT_NAME }}-linux-x64-$VERSION.tar.gz * && cd ../../../
        
        # 2. 打包 macOS 独立应用程序包 (含有完整 .app 依赖的 .tar.gz)
        cd dist/binaries/macos && tar -czf ../../packages/${{ env.PROJECT_NAME }}-macos-arm64-$VERSION.tar.gz * && cd ../../../
        
        # 3. 打包 Windows 独立绿色包 (含有完整 Qt 运行环境动态库的 .zip)
        cd dist/binaries/windows && zip -r ../../packages/${{ env.PROJECT_NAME }}-windows-x64-$VERSION.zip * && cd ../../../

    # ================================ 原有源码独立打包功能区 ================================
    - name: Create comprehensive source package
      run: |
        echo "=== Creating comprehensive source package ==="
        PACKAGE_NAME="${{ env.PROJECT_NAME }}-source-${{ env.VERSION }}"
        mkdir -p dist
        
        cat > .package_exclude << 'EOF'
        build/*
        dist
        dist/*
        packages
        packages/*
        tools/vcpkg/buildtrees/*
        tools/vcpkg/packages/*
        tools/vcpkg/downloads/*
        tools/vcpkg/installed/*
        .vscode/settings.json
        .idea/*
        *.swp
        *.swo
        *~
        .DS_Store
        Thumbs.db
        desktop.ini
        *.log
        *.tmp
        *.temp
        __pycache__/*
        *.pyc
        *.pyo
        .pytest_cache/*
        .git/*
        .gitmodules
        .github/workflows/cache/*
        EOF
        
        tar --exclude-from=.package_exclude -czf "dist/${PACKAGE_NAME}.tar.gz" --transform "s,^,${PACKAGE_NAME}/," --exclude=".package_exclude" * .[^.]* 2>/dev/null || \
        tar --exclude-from=.package_exclude -czf "dist/${PACKAGE_NAME}.tar.gz" --transform "s,^,${PACKAGE_NAME}/," --exclude=".package_exclude" *
        
        zip -r "dist/${PACKAGE_NAME}.zip" . -x@.package_exclude -x ".package_exclude" > /dev/null 2>&1 || true
        
        cat > "dist/${PACKAGE_NAME}.info" << EOF
        Package: ${{ env.PROJECT_NAME }}
        Version: ${{ env.VERSION }}
        Architecture: source
        Maintainer: ${{ github.repository_owner }}
        Homepage: https://github.com/${{ github.repository }}
        Build-Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
        Commit: ${{ github.sha }}
        EOF
        
        cd dist
        sha256sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"
        sha256sum "${PACKAGE_NAME}.zip" > "${PACKAGE_NAME}.zip.sha256"
        md5sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.md5"
        md5sum "${PACKAGE_NAME}.zip" > "${PACKAGE_NAME}.zip.md5"
        
        cat > "${PACKAGE_NAME}.manifest" << EOF
        {
          "name": "${{ env.PROJECT_NAME }}-source",
          "version": "${{ env.VERSION }}",
          "repository": "${{ github.repository }}",
          "commit": "${{ github.sha }}",
          "build_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        }
        EOF

    - name: Upload to GitHub Container Registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
        cd dist
        PACKAGE_NAME="${{ env.PROJECT_NAME }}-source-${{ env.VERSION }}"
        cat > Dockerfile << EOF
        FROM scratch
        COPY ${PACKAGE_NAME}.tar.gz /
        COPY ${PACKAGE_NAME}.zip /
        EOF
        IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-source:${{ env.VERSION }}"
        docker build -t "$IMAGE_TAG" .
        docker push "$IMAGE_TAG"

    # ================================ 【统一发布】把源码与二进制包在同一个 Release 中集中呈现 ================================
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.VERSION }}
        name: RAG-Qt ${{ env.VERSION }}
        files: |
          dist/${{ env.PROJECT_NAME }}-source-${{ env.VERSION }}.tar.gz
          dist/${{ env.PROJECT_NAME }}-source-${{ env.VERSION }}.zip
          dist/${{ env.PROJECT_NAME }}-source-${{ env.VERSION }}.*.sha256
          dist/${{ env.PROJECT_NAME }}-source-${{ env.VERSION }}.*.md5
          dist/${{ env.PROJECT_NAME }}-source-${{ env.VERSION }}.manifest
          dist/${{ env.PROJECT_NAME }}-source-${{ env.VERSION }}.info
          dist/packages/${{ env.PROJECT_NAME }}-linux-x64-${{ env.VERSION }}.tar.gz
          dist/packages/${{ env.PROJECT_NAME }}-macos-arm64-${{ env.VERSION }}.tar.gz
          dist/packages/${{ env.PROJECT_NAME }}-windows-x64-${{ env.VERSION }}.zip
        body: |
          ## RAG-Qt ${{ env.VERSION }}
          
          ### 🚀 客户端二进制包下载 (Application Packages)
          
          | 操作系统平台 | 架构 | 下载链接 |
          |---|---|---|
          | **Windows** | Windows x64 | 📦 [`${{ env.PROJECT_NAME }}-windows-x64-${{ env.VERSION }}.zip`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.PROJECT_NAME }}-windows-x64-${{ env.VERSION }}.zip) |
          | **macOS** | Apple Silicon (M1/M2/M3) | 📦 [`${{ env.PROJECT_NAME }}-macos-arm64-${{ env.VERSION }}.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.PROJECT_NAME }}-macos-arm64-${{ env.VERSION }}.tar.gz) |
          | **Linux** | Ubuntu / Linux x64 | 📦 [`${{ env.PROJECT_NAME }}-linux-x64-${{ env.VERSION }}.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.PROJECT_NAME }}-linux-x64-${{ env.VERSION }}.tar.gz) |
          
          ### 📦 独立源码包下载 (Source Code Packages)
          * `${{ env.PROJECT_NAME }}-source-${{ env.VERSION }}.tar.gz` (推荐 Linux/macOS 环境使用)
          * `${{ env.PROJECT_NAME }}-source-${{ env.VERSION }}.zip` (推荐 Windows 环境使用)