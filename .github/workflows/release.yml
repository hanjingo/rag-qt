name: Release Pipeline

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PROJECT_NAME: rag-qt

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # 支持 workflow_dispatch 和 CI 成功后的 tag 触发
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && 
       (github.event.workflow_run.event == 'tag' ||
        github.event.workflow_run.event == 'create'))
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Extract version information
      id: version
      run: |
        # 支持任意格式 tag：v0.0.1, 0.0.1, 0.0.1#1 等
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          # 尝试从 workflow_run 获取版本
          if [[ -n "${{ github.event.workflow_run.head_branch }}" && "${{ github.event.workflow_run.head_branch }}" != "null" ]]; then
            VERSION="${{ github.event.workflow_run.head_branch }}"
          else
            # 从 commit 关联的 tag 获取
            VERSION=$(git tag --points-at ${{ github.event.workflow_run.head_sha }} | head -n 1)
          fi
          
          # 兜底：获取最新 tag
          if [[ -z "$VERSION" ]]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")
          fi
        fi
        
        # 清理前缀
        VERSION=${VERSION##*/}
        VERSION=${VERSION#refs/tags/}
        VERSION=${VERSION#refs/heads/}
        
        # 安全版本（替换 Docker 非法字符）
        SAFE_VERSION=$(echo "$VERSION" | sed 's/[#:*?"<>|]/_/g')
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "SAFE_VERSION=$SAFE_VERSION" >> $GITHUB_ENV
        echo "Using version: $VERSION (Safe: $SAFE_VERSION)"

    # ========== 下载 CI 构建产物 ==========
    - name: Download Linux Executable
      uses: actions/download-artifact@v4
      with:
        name: binary-linux
        path: dist/binaries/linux
        run-id: ${{ github.event.workflow_run.id }}
      continue-on-error: false

    - name: Download macOS Executable
      uses: actions/download-artifact@v4
      with:
        name: binary-macos
        path: dist/binaries/macos
        run-id: ${{ github.event.workflow_run.id }}
      continue-on-error: false

    - name: Download Windows Executable
      uses: actions/download-artifact@v4
      with:
        name: binary-windows
        path: dist/binaries/windows
        run-id: ${{ github.event.workflow_run.id }}
      continue-on-error: false

    - name: Verify artifacts downloaded
      run: |
        echo "=== Checking downloaded artifacts ==="
        for dir in dist/binaries/*; do
          if [ -d "$dir" ]; then
            echo "Files in $dir:"
            ls -la "$dir" || echo "  (empty)"
          fi
        done

    - name: Compress Platform Packages
      run: |
        VERSION="${{ env.SAFE_VERSION }}"
        mkdir -p dist/packages
        
        # Linux
        if [ -d "dist/binaries/linux" ] && [ "$(ls -A dist/binaries/linux)" ]; then
          cd dist/binaries/linux && zip -r ../../packages/${{ env.PROJECT_NAME }}-linux-x64-$VERSION.zip * && cd ../../../
        else
          echo "⚠️ Warning: No Linux binaries found to package"
        fi
        
        # macOS
        if [ -d "dist/binaries/macos" ] && [ "$(ls -A dist/binaries/macos)" ]; then
          cd dist/binaries/macos && zip -r -y ../../packages/${{ env.PROJECT_NAME }}-macos-arm64-$VERSION.zip * && cd ../../../
        else
          echo "⚠️ Warning: No macOS binaries found to package"
        fi
        
        # Windows
        if [ -d "dist/binaries/windows" ] && [ "$(ls -A dist/binaries/windows)" ]; then
          cd dist/binaries/windows && zip -r ../../packages/${{ env.PROJECT_NAME }}-windows-x64-$VERSION.zip * && cd ../../../
        else
          echo "⚠️ Warning: No Windows binaries found to package"
        fi

    # ========== 源码打包 ==========
    - name: Create source package
      run: |
        echo "=== Creating source package ==="
        PACKAGE_NAME="${{ env.PROJECT_NAME }}-source-${{ env.SAFE_VERSION }}"
        mkdir -p dist
        
        cat > .package_exclude << 'EOF'
        build/*
        dist
        dist/*
        packages
        packages/*
        tools/vcpkg/buildtrees/*
        tools/vcpkg/packages/*
        tools/vcpkg/downloads/*
        tools/vcpkg/installed/*
        .vscode/settings.json
        .idea/*
        *.swp
        *.swo
        *~
        .DS_Store
        Thumbs.db
        desktop.ini
        *.log
        *.tmp
        *.temp
        __pycache__/*
        *.pyc
        *.pyo
        .pytest_cache/*
        .git/*
        .gitmodules
        .github/workflows/cache/*
        EOF
        
        tar --exclude-from=.package_exclude -czf "dist/${PACKAGE_NAME}.tar.gz" --transform "s,^,${PACKAGE_NAME}/," --exclude=".package_exclude" * .[^.]* 2>/dev/null || \
        tar --exclude-from=.package_exclude -czf "dist/${PACKAGE_NAME}.tar.gz" --transform "s,^,${PACKAGE_NAME}/," --exclude=".package_exclude" *
        
        zip -r "dist/${PACKAGE_NAME}.zip" . -x@.package_exclude -x ".package_exclude" > /dev/null 2>&1 || true
        
        cat > "dist/${PACKAGE_NAME}.info" << EOF
        Package: ${{ env.PROJECT_NAME }}
        Version: ${{ env.VERSION }}
        Architecture: source
        Maintainer: ${{ github.repository_owner }}
        Homepage: https://github.com/${{ github.repository }}
        Build-Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
        Commit: ${{ github.sha }}
        EOF
        
        cd dist
        sha256sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"
        sha256sum "${PACKAGE_NAME}.zip" > "${PACKAGE_NAME}.zip.sha256"
        md5sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.md5"
        md5sum "${PACKAGE_NAME}.zip" > "${PACKAGE_NAME}.zip.md5"
        
        cat > "${PACKAGE_NAME}.manifest" << EOF
        {
          "name": "${{ env.PROJECT_NAME }}-source",
          "version": "${{ env.VERSION }}",
          "repository": "${{ github.repository }}",
          "commit": "${{ github.sha }}",
          "build_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        }
        EOF

    - name: Upload to GitHub Container Registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
        cd dist
        PACKAGE_NAME="${{ env.PROJECT_NAME }}-source-${{ env.SAFE_VERSION }}"
        cat > Dockerfile << EOF
        FROM scratch
        COPY ${PACKAGE_NAME}.tar.gz /
        COPY ${PACKAGE_NAME}.zip /
        EOF
        IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-source:${{ env.SAFE_VERSION }}"
        docker build -t "$IMAGE_TAG" .
        docker push "$IMAGE_TAG"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.VERSION }}
        name: RAG-Qt ${{ env.VERSION }}
        files: |
          dist/${{ env.PROJECT_NAME }}-source-${{ env.SAFE_VERSION }}.tar.gz
          dist/${{ env.PROJECT_NAME }}-source-${{ env.SAFE_VERSION }}.zip
          dist/${{ env.PROJECT_NAME }}-source-${{ env.SAFE_VERSION }}.*.sha256
          dist/${{ env.PROJECT_NAME }}-source-${{ env.SAFE_VERSION }}.*.md5
          dist/${{ env.PROJECT_NAME }}-source-${{ env.SAFE_VERSION }}.manifest
          dist/${{ env.PROJECT_NAME }}-source-${{ env.SAFE_VERSION }}.info
          dist/packages/${{ env.PROJECT_NAME }}-linux-x64-${{ env.SAFE_VERSION }}.zip
          dist/packages/${{ env.PROJECT_NAME }}-macos-arm64-${{ env.SAFE_VERSION }}.zip
          dist/packages/${{ env.PROJECT_NAME }}-windows-x64-${{ env.SAFE_VERSION }}.zip
        body: |
          ## RAG-Qt ${{ env.VERSION }}
          
          ### 🚀 客户端二进制包下载 (Application Packages)
          
          | 操作系统平台 | 架构 | 下载链接 |
          |---|---|---|
          | **Windows** | Windows x64 | 📦 [`${{ env.PROJECT_NAME }}-windows-x64-${{ env.SAFE_VERSION }}.zip`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.PROJECT_NAME }}-windows-x64-${{ env.SAFE_VERSION }}.zip) |
          | **macOS** | Apple Silicon (M1/M2/M3) | 📦 [`${{ env.PROJECT_NAME }}-macos-arm64-${{ env.SAFE_VERSION }}.zip`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.PROJECT_NAME }}-macos-arm64-${{ env.SAFE_VERSION }}.zip) |
          | **Linux** | Ubuntu / Linux x64 | 📦 [`${{ env.PROJECT_NAME }}-linux-x64-${{ env.SAFE_VERSION }}.zip`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.PROJECT_NAME }}-linux-x64-${{ env.SAFE_VERSION }}.zip) |
          
          ### 📦 独立源码包下载 (Source Code Packages)
          * `${{ env.PROJECT_NAME }}-source-${{ env.SAFE_VERSION }}.tar.gz` (推荐 Linux/macOS 环境使用)
          * `${{ env.PROJECT_NAME }}-source-${{ env.SAFE_VERSION }}.zip` (推荐 Windows 环境使用)