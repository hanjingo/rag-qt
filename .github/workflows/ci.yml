name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, qwidget, ci ]
    # 【已修复】允许任何格式的 Tag 触发 CI 构建，包含 0.0.1, v1.0, test-tag 等所有形式
    tags: [ '**' ]
  pull_request:
    branches: [ master, main ]

env:
  BUILD_TYPE: Release
  PROJECT_NAME: rag-qt
  SENTRY_ORG: your-sentry-org
  SENTRY_PROJECT: rag-qt

jobs:

  # ================================ Build (Linux) ================================
  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Release]
        cuda_enabled: [false]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup virtual display
      run: |
        export DISPLAY=:99.0
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        echo "DISPLAY=:99.0" >> $GITHUB_ENV

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.3'
        arch: 'linux_gcc_64'
        cache: true
        modules: 'qtmultimedia'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake build-essential \
          ninja-build \
          libgl1-mesa-dev \
          libxcb-util-dev \
          libxcb-icccm4-dev \
          libxcb-image0-dev \
          libxcb-keysyms1-dev \
          libxcb-randr0-dev \
          libxcb-render-util0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxcb-xinerama0-dev \
          libxcb-xkb-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libx11-xcb-dev \
          autoconf \
          autoconf-archive \
          automake \
          libtool \
          libomp-dev

    - name: Setup vcpkg
      run: |
        echo "=== Setting up vcpkg ==="
        git clone https://github.com/Microsoft/vcpkg.git tools/vcpkg --depth=1
        chmod +x tools/vcpkg/bootstrap-vcpkg.sh
        ./tools/vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=${{ github.workspace }}/tools/vcpkg" >> $GITHUB_ENV
        echo "${{ github.workspace }}/tools/vcpkg" >> $GITHUB_PATH

    - name: Configure CMake
      env:
        VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      run: |
        if [ "${{ matrix.cuda_enabled }}" == "true" ]; then
          VCPKG_FEATURES="ggml[cuda],whisper-cpp[cuda]"
        else
          VCPKG_FEATURES="ggml,whisper-cpp"
        fi
        
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DBUILD_RELEASE_LITE=OFF \
          -DVCPKG_MANIFEST_FEATURES="${VCPKG_FEATURES}" \
          -DOpenMP_CXX_FLAGS="-fopenmp" \
          -DOpenMP_C_FLAGS="-fopenmp"

    - name: Build
      run: |
        JOBS=$(nproc)
        if [ "$JOBS" -lt 1 ]; then JOBS=1; fi
        cmake --build build --config ${{ matrix.build_type }} --parallel $JOBS

    - name: Run tests
      working-directory: build
      run: |
        ctest --output-on-failure --parallel $(nproc) -C ${{ matrix.build_type }}

    - name: Collect Linux App Binary
      run: |
        # 1. 创建干净的临时输出目录
        rm -rf dist_bin
        mkdir -p dist_bin
        
        echo "=== 开始全盘检索 Linux 二进制文件 ${{ env.PROJECT_NAME }} ==="
        # 全盘扫描，排除 dist_bin 自身，精准找出目标裸文件
        BIN_PATH=$(find . -type f -name "${{ env.PROJECT_NAME }}" ! -path "*/dist_bin/*" | head -n 1)
        
        if [ -n "$BIN_PATH" ]; then
          echo "【成功】找到可执行文件，真实路径为: $BIN_PATH"
          cp "$BIN_PATH" dist_bin/
          
          # 拷贝可能附带的配置文件
          if [ -d "bin/${{ matrix.build_type }}/configs" ]; then
              cp -r "bin/${{ matrix.build_type }}/configs" dist_bin/
          elif [ -d "build/bin/${{ matrix.build_type }}/configs" ]; then
              cp -r "build/bin/${{ matrix.build_type }}/configs" dist_bin/
          fi
          
          echo "=== 最终打包目录文件列表如下 ==="
          ls -la dist_bin
        else
          echo "::error::【错误】在整个工作区都未找到 ${{ env.PROJECT_NAME }}！请检查上一步 Build 是否成功。"
          echo "当前根目录结构如下："
          find . -maxdepth 3
          exit 1
        fi

    - name: Upload Linux Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-linux
        path: dist_bin/
        retention-days: 1

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs-linux-${{ matrix.build_type }}-cuda-${{ matrix.cuda_enabled }}
        path: |
          build/CMakeFiles/CMakeOutput.log
          build/CMakeFiles/CMakeError.log
        retention-days: 7

  # ================================ Build (macOS ARM64) ================================
  build-macos:
    name: Build and Test (macOS ARM64)
    runs-on: macos-14
    strategy:
      matrix:
        build_type: [Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Metal toolchain
      run: |
        sudo xcodebuild -downloadPlatform macOS || true

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.3'
        arch: 'clang_64'
        cache: true
        modules: 'qtmultimedia'

    - name: Install dependencies
      run: |
        brew install cmake ninja autoconf automake autoconf-archive libtool unixodbc libomp || true
        brew unlink automake autoconf libtool 2>/dev/null || true
        brew link --force --overwrite automake autoconf autoconf-archive libtool || true

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git tools/vcpkg --depth=1
        chmod +x tools/vcpkg/bootstrap-vcpkg.sh
        ./tools/vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=${{ github.workspace }}/tools/vcpkg" >> $GITHUB_ENV
        echo "${{ github.workspace }}/tools/vcpkg" >> $GITHUB_PATH

    - name: Create vcpkg triplet for macOS
      run: |
        mkdir -p tools/vcpkg/triplets/community
        BREW_PREFIX=$(brew --prefix)
        cat > tools/vcpkg/triplets/community/arm64-osx-relaxed.cmake << EOF
        set(VCPKG_TARGET_ARCHITECTURE arm64)
        set(VCPKG_CRT_LINKAGE dynamic)
        set(VCPKG_LIBRARY_LINKAGE static)
        set(VCPKG_CMAKE_SYSTEM_NAME Darwin)
        set(VCPKG_OSX_DEPLOYMENT_TARGET "11.0")
        set(VCPKG_OSX_ARCHITECTURES arm64)
        set(VCPKG_CXX_FLAGS "-arch arm64 -I${BREW_PREFIX}/opt/libomp/include -Xpreprocessor -fopenmp -Wno-deprecated -Wno-deprecated-declarations -Wno-deprecated-builtins -Wno-unknown-warning-option")
        set(VCPKG_C_FLAGS "-arch arm64 -I${BREW_PREFIX}/opt/libomp/include -Xpreprocessor -fopenmp -Wno-deprecated -Wno-deprecated-declarations -Wno-unknown-warning-option")
        set(VCPKG_LINKER_FLAGS "-L${BREW_PREFIX}/opt/libomp/lib -Wl,-rpath,${BREW_PREFIX}/opt/libomp/lib")
        list(APPEND VCPKG_CMAKE_CONFIGURE_OPTIONS
          "-DOpenMP_ROOT=${BREW_PREFIX}/opt/libomp"
          "-DOpenMP_C_FLAGS=-Xpreprocessor -fopenmp"
          "-DOpenMP_CXX_FLAGS=-Xpreprocessor -fopenmp"
          "-DOpenMP_C_LIB_NAMES=omp"
          "-DOpenMP_CXX_LIB_NAMES=omp"
          "-DOpenMP_omp_LIBRARY=${BREW_PREFIX}/opt/libomp/lib/libomp.dylib"
        )
        EOF

    - name: Configure CMake
      env:
        VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      run: |
        BREW_PREFIX=$(brew --prefix)
        SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
        VCPKG_FEATURES=""
        
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_C_COMPILER=/usr/bin/clang \
          -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
          -DCMAKE_OSX_SYSROOT="${SDKROOT}" \
          -DCMAKE_CXX_FLAGS="-arch arm64 -I${BREW_PREFIX}/opt/libomp/include -Xpreprocessor -fopenmp -Wno-deprecated -Wno-deprecated-declarations -Wno-unknown-warning-option" \
          -DCMAKE_C_FLAGS="-arch arm64 -I${BREW_PREFIX}/opt/libomp/include -Xpreprocessor -fopenmp -Wno-deprecated -Wno-deprecated-declarations -Wno-unknown-warning-option" \
          -DCMAKE_EXE_LINKER_FLAGS="-L${BREW_PREFIX}/opt/libomp/lib -Wl,-rpath,${BREW_PREFIX}/opt/libomp/lib" \
          -DOpenMP_ROOT="$BREW_PREFIX/opt/libomp" \
          -DOpenMP_C_FLAGS="-Xpreprocessor -fopenmp -I$BREW_PREFIX/opt/libomp/include" \
          -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I$BREW_PREFIX/opt/libomp/include" \
          -DOpenMP_C_LIB_NAMES="omp" \
          -DOpenMP_CXX_LIB_NAMES="omp" \
          -DOpenMP_omp_LIBRARY="$BREW_PREFIX/opt/libomp/lib/libomp.dylib" \
          -DVCPKG_TARGET_TRIPLET=arm64-osx-relaxed \
          -DBUILD_RELEASE_LITE=OFF \
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/tools/vcpkg/triplets/community \
          -DVCPKG_MANIFEST_FEATURES="${VCPKG_FEATURES}" \
          -DVCPKG_FEATURE_FLAGS="versions,manifests,registries"

    - name: Build
      run: |
        NPROC=$(sysctl -n hw.ncpu)
        cmake --build build --config ${{ matrix.build_type }} --parallel $NPROC

    - name: Run tests
      working-directory: build
      run: |
        NPROC=$(sysctl -n hw.ncpu)
        ctest --output-on-failure --parallel $NPROC -C ${{ matrix.build_type }}

    - name: Deploy and Collect macOS App
      run: |
        # 1. 创建干净的临时输出目录
        rm -rf dist_bin
        mkdir -p dist_bin
        
        echo "=== 开始全盘检索 macOS 应用程序 (.app 或 裸二进制) ==="
        # 全盘扫描寻找 App Bundle 包
        APP_PATH=$(find . -name "${{ env.PROJECT_NAME }}.app" -maxdepth 4 ! -path "*/dist_bin/*" 2>/dev/null | head -n 1)
        
        if [ -n "$APP_PATH" ]; then
          echo "【成功】找到 App Bundle，路径为: $APP_PATH"
          # 对原产地应用包直接进行内联部署依赖注入
          macdeployqt "$APP_PATH" -verbose=1
          cp -R "$APP_PATH" dist_bin/
          
          # 拷贝可能附带的配置文件到捆绑包内部 Resource 目录
          if [ -d "bin/${{ matrix.build_type }}/configs" ]; then
              cp -r "bin/${{ matrix.build_type }}/configs" "dist_bin/${{ env.PROJECT_NAME }}.app/Contents/Resources/" 2>/dev/null || true
          elif [ -d "build/bin/${{ matrix.build_type }}/configs" ]; then
              cp -r "build/bin/${{ matrix.build_type }}/configs" "dist_bin/${{ env.PROJECT_NAME }}.app/Contents/Resources/" 2>/dev/null || true
          fi
          
        else
          echo "【提示】未找到 App Bundle，降级检索裸二进制文件..."
          # 尝试全盘搜索裸可执行文件
          BIN_PATH=$(find . -type f -name "${{ env.PROJECT_NAME }}" ! -path "*/dist_bin/*" | head -n 1)
          
          if [ -n "$BIN_PATH" ]; then
            echo "【成功】找到裸二进制文件，真实路径为: $BIN_PATH"
            cp "$BIN_PATH" dist_bin/
            
            if [ -d "bin/${{ matrix.build_type }}/configs" ]; then
                cp -r "bin/${{ matrix.build_type }}/configs" dist_bin/
            elif [ -d "build/bin/${{ matrix.build_type }}/configs" ]; then
                cp -r "build/bin/${{ matrix.build_type }}/configs" dist_bin/
            fi
          else
            echo "::error::【错误】在整个工作区都未找到任何 macOS 构建产物！"
            echo "当前根目录结构如下："
            find . -maxdepth 3
            exit 1
          fi
        fi
        
        echo "=== 最终打包目录文件列表如下 ==="
        ls -la dist_bin

    - name: Upload macOS Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-macos
        path: dist_bin/
        retention-days: 1

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs-macos-arm64-${{ matrix.build_type }}
        path: |
          build/CMakeFiles/CMakeOutput.log
          build/CMakeFiles/CMakeError.log
        retention-days: 7

  # ================================ Build (Windows) ================================
  build-windows:
    name: Build and Test (Windows)
    runs-on: windows-2022
    strategy:
      matrix:
        build_type: [Release]
        cuda_enabled: [false]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.3'
        arch: 'win64_msvc2022_64'
        cache: true
        modules: 'qtmultimedia'

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git tools/vcpkg --depth=1
        cd tools/vcpkg
        cmd /c "bootstrap-vcpkg.bat"
        cd ../..
        $vcpkgRoot = "${{ github.workspace }}\tools\vcpkg"
        echo "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "$vcpkgRoot" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Configure CMake
      run: |
        $vcpkgRoot = $env:VCPKG_ROOT
        if (-not $vcpkgRoot) { $vcpkgRoot = "${{ github.workspace }}\tools\vcpkg" }
        $toolchainFile = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
        
        if (${{ matrix.cuda_enabled }} -eq $true) {
          $VCPKG_FEATURES = "ggml[cuda],whisper-cpp[cuda]"
        } else {
          $VCPKG_FEATURES = "ggml,whisper-cpp"
        }
        
        cmake -B build -G "Visual Studio 17 2022" `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_TOOLCHAIN_FILE="$toolchainFile" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
          -DBUILD_RELEASE_LITE=OFF `
          -DVCPKG_MANIFEST_FEATURES="$VCPKG_FEATURES"

    - name: Build
      run: |
        $jobs = [System.Environment]::ProcessorCount
        cmake --build build --config ${{ matrix.build_type }} --target ${{ env.PROJECT_NAME }} --parallel $jobs

    - name: Run tests
      working-directory: build
      run: |
        $jobs = [System.Environment]::ProcessorCount
        ctest --output-on-failure --parallel $jobs -C ${{ matrix.build_type }}

    - name: Deploy and Collect Windows App
      shell: pwsh
      run: |
        # 1. 创建干净的临时输出目录
        if (Test-Path "dist_bin") { Remove-Item -Recurse -Force "dist_bin" }
        New-Item -ItemType Directory -Force -Path dist_bin
        
        Write-Host "=== 开始全盘检索 ${{ env.PROJECT_NAME }}.exe ==="
        $EXE_PATH = Get-ChildItem -Path . -Filter "${{ env.PROJECT_NAME }}.exe" -Recurse | Where-Object { $_.FullName -notmatch "dist_bin" } | Select-Object -First 1
        
        if ($EXE_PATH) {
          Write-Host "【成功】找到可执行文件，真实路径为: $($EXE_PATH.FullName)"
          Copy-Item $EXE_PATH.FullName -Destination dist_bin\
          
          if (Test-Path "bin/${{ matrix.build_type }}/configs") {
              Copy-Item -Recurse "bin/${{ matrix.build_type }}/configs" -Destination dist_bin\
          } elseif (Test-Path "build/bin/${{ matrix.build_type }}/configs") {
              Copy-Item -Recurse "build/bin/${{ matrix.build_type }}/configs" -Destination dist_bin\
          }
          
          Write-Host "=== 开始执行 windeployqt 依赖分发 ==="
          & "$env:QT_PLUGIN_PATH\..\bin\windeployqt.exe" --no-compiler-runtime dist_bin\${{ env.PROJECT_NAME }}.exe
          
          Write-Host "=== 依赖分发完成，最终打包目录文件列表如下： ==="
          Get-ChildItem -Path dist_bin
        } else {
          Write-Error "【错误】在整个工作区都未找到 ${{ env.PROJECT_NAME }}.exe！请检查上一步 Build 是否成功。"
          Write-Host "当前根目录结构如下："
          Get-ChildItem -Recurse -Depth 2
          exit 1
        }

    - name: Upload Windows Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-windows
        path: dist_bin/
        retention-days: 1

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs-windows-${{ matrix.build_type }}-cuda-${{ matrix.cuda_enabled }}
        path: |
          build/Testing/Temporary/LastTest.log
        retention-days: 7

  # ================================ Build Summary ================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: always()
    
    steps:
    - name: Check build results
      run: |
        # 修复：只有真正失败时才 exit 1，全部成功时 exit 0
        if [[ "${{ needs.build-linux.result }}" == "success" && "${{ needs.build-macos.result }}" == "success" && "${{ needs.build-windows.result }}" == "success" ]]; then
          echo "✅ All builds passed!"
          exit 0
        else
          echo "❌ Some builds failed!"
          echo "Linux: ${{ needs.build-linux.result }}"
          echo "macOS: ${{ needs.build-macos.result }}"
          echo "Windows: ${{ needs.build-windows.result }}"
          exit 1
        fi